<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عيادة الأسنان الذكية</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #00bcd4;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.7rem;
      background-image: url('https://img.freepik.com/free-vector/dental-care-clinic-background-design_1017-31305.jpg');
      background-size: cover;
      background-position: center;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .container {
      padding: 1rem;
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-top: -3rem;
      position: relative;
      z-index: 1;
    }
    label {
      display: block;
      margin: 1rem 0 0.5rem;
    }
    input, textarea, button {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      background-color: #00bcd4;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0097a7;
    }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    عيادة الأسنان الذكية - منصة التواصل بين المريض والطبيب
  </header>  <div class="container">
    <form id="contactForm">
      <label for="name">اسم المريض:</label>
      <input type="text" id="name" name="name" required><label for="phone">رقم الهاتف:</label>
  <input type="tel" id="phone" name="phone" required>

  <label for="message">وصف الحالة أو الألم:</label>
  <textarea id="message" name="message" rows="4" required></textarea>

  <label for="image">صورة من الكاميرا (المنطقة المصابة):</label>
  <input type="file" id="image" name="image" accept="image/*" capture>

  <button type="submit">إرسال للطبيب</button>
</form>

  </div>  <footer>
    &copy; 2025 عيادة الأسنان الذكية - جميع الحقوق محفوظة
  </footer>  <script>
    document.getElementById("contactForm").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("✅ تم إرسال الحالة للطبيب بنجاح! سيتواصل معك قريبًا.");
      this.reset();
    });
  </script></body>
</html>
<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الطبيب</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #00acc1;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
    }
    .container {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    .case {
      background: white;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 1rem;
    }
    .case h3 {
      margin: 0 0 0.5rem 0;
      color: #007c91;
    }
    .case p {
      margin: 0.3rem 0;
    }
  </style>
</head>
<body>
  <header>لوحة تحكم الطبيب</header>  <div class="container" id="casesContainer">
    <p>جاري تحميل الحالات...</p>
  </div>  <script>
    // بيانات تجريبية للحالات
    const cases = [
      {
        name: "أحمد علي",
        phone: "01012345678",
        description: "ألم شديد في الضرس الخلفي",
        image: "https://via.placeholder.com/150"
      },
      {
        name: "سارة محمد",
        phone: "01198765432",
        description: "نزيف بسيط بعد الخلع",
        image: "https://via.placeholder.com/150"
      }
    ];

    const container = document.getElementById("casesContainer");
    container.innerHTML = "";

    cases.forEach((c, i) => {
      const caseDiv = document.createElement("div");
      caseDiv.className = "case";
      caseDiv.innerHTML = `
        <h3>الحالة #${i + 1}</h3>
        <p><strong>الاسم:</strong> ${c.name}</p>
        <p><strong>رقم الهاتف:</strong> ${c.phone}</p>
        <p><strong>الوصف:</strong> ${c.description}</p>
        <img src="${c.image}" alt="صورة الحالة" width="150">
      `;
      container.appendChild(caseDiv);
    });
  </script></body>
</html>
