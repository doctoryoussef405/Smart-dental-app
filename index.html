<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إرسال حالة مريض</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; color: #007c91; }
    label { margin-top: 1rem; display: block; }
    input, textarea, button {
      width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: 1px solid #ccc;
    }
    button {
      background-color: #00bcd4;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover { background-color: #0097a7; }
  </style>
</head>
<body>
  <div class="container">
    <h2>إرسال حالة إلى الطبيب</h2>
    <form id="patientForm">
      <label for="name">اسم المريض:</label>
      <input type="text" id="name" required><label for="phone">رقم الهاتف:</label>
  <input type="tel" id="phone" required>

  <label for="desc">وصف الحالة:</label>
  <textarea id="desc" rows="4" required></textarea>

  <label for="image">صورة المنطقة المصابة:</label>
  <input type="file" id="image" accept="image/*" capture required>

  <button type="submit">إرسال الحالة</button>
</form>

  </div>  <!-- Firebase SDKs -->  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-storage-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyADBjYKkzTeHEZutaYE7l3jJ761zL98SLs",
      authDomain: "smart-dental-dba96.firebaseapp.com",
      projectId: "smart-dental-dba96",
      storageBucket: "smart-dental-dba96.appspot.com",
      messagingSenderId: "535352681456",
      appId: "1:535352681456:web:ab143252b9d55a55013335"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    document.getElementById("patientForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const desc = document.getElementById("desc").value;
      const file = document.getElementById("image").files[0];

      if (!file) return alert("يرجى رفع صورة الحالة");

      const imageRef = storage.ref('cases/' + Date.now() + '_' + file.name);
      await imageRef.put(file);
      const imageUrl = await imageRef.getDownloadURL();

      await db.collection("cases").add({
        name,
        phone,
        description: desc,
        image: imageUrl,
        created: new Date()
      });

      alert("✅ تم إرسال الحالة بنجاح!");
      this.reset();
    });
  </script></body>
</html>
