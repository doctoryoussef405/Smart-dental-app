<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الطبيب</title>
  <script type="module" src="firebase.js"></script>
  <script type="module">
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
    import { app } from './firebase.js';const db = getFirestore(app);
const storage = getStorage(app);

async function loadCases() {
  const container = document.getElementById("casesContainer");
  container.innerHTML = "<p>جاري التحميل...</p>";

  const querySnapshot = await getDocs(collection(db, "cases"));
  container.innerHTML = "";

  querySnapshot.forEach(async (doc) => {
    const data = doc.data();
    const imgUrl = data.imagePath ? await getDownloadURL(ref(storage, data.imagePath)) : "";

    const div = document.createElement("div");
    div.className = "case";
    div.innerHTML = `
      <h3>اسم المريض: ${data.name}</h3>
      <p><strong>الهاتف:</strong> ${data.phone}</p>
      <p><strong>الوصف:</strong> ${data.message}</p>
      ${imgUrl ? `<img src="${imgUrl}" width="200">` : ''}
      <hr>
    `;
    container.appendChild(div);
  });
}

document.addEventListener("DOMContentLoaded", loadCases);

  </script>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background-color: #f8f9fa;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      color: #007c91;
    }
    .case {
      background: white;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    img {
      margin-top: 1rem;
      border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <h1>لوحة تحكم الطبيب</h1>
  <div id="casesContainer">
    <p>يتم تحميل الحالات الآن...</p>
  </div>
</body>
</html>
